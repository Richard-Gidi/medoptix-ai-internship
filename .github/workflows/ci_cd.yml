# This single file replaces both ci.yml and deploy.yml
# It ensures a robust, sequential build-then-deploy processlet check if it works now.

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  #########################################
  #      CONTINUOUS INTEGRATION JOB       #
  #########################################
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # - name: Run tests with Pytest
      #   run: pytest # <-- NOTE: Tests are temporarily disabled. Uncomment this section when tests are added.

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/medoptix-api:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/medoptix-api:latest

  #########################################
  #      CONTINUOUS DEPLOYMENT JOB      #
  #########################################
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build # <-- CRITICAL: This ensures deployment only runs after a successful build

    steps:
      - name: Deploy to EC2 Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Navigate to the application directory
            cd medoptix-ai-internship

            # Pull the latest image explicitly from Docker Hub
            docker pull ${{ secrets.DOCKER_USERNAME }}/medoptix-api:latest

            # Bring down the old containers and start the new ones
            docker-compose up -d --remove-orphans

            # Optional: Clean up old, unused Docker images to save space
            docker image prune -f

      - name: Verify Deployment Health
        run: |
          sleep 20 # Wait for the service to stabilize
          curl -fS https://sabisave.info/health || exit 1
