services:
  api:
    image: ${DOCKER_USERNAME}/medoptix-api:latest
    ports:
      - "8001:8000" # Fixed: was "8000-8001:8000" which is invalid
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - DOCKER_USERNAME=${DOCKER_USERNAME}
    volumes:
      - ./models:/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
